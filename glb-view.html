<!doctype html>
<html><head><meta charset="utf-8"><title>GLB view</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px monospace}#c{display:grid;grid-template-columns:1fr 1fr;gap:2px}canvas{width:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
</head><body><div id="c"></div><pre id="o"></pre>
<script>
// tools/glb-view.html?f=models/src/x.glb[&ry=deg] — four views + size / part summary in window.info (dev tool, not shipped)
const q = new URLSearchParams(location.search), f = q.get('f');
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(640, 400); R.outputEncoding = THREE.sRGBEncoding;
const S = new THREE.Scene(); S.background = new THREE.Color(0x8a9099);
S.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2)); const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(3, 5, 4); S.add(dl);
new THREE.GLTFLoader().load(f, (g) => {
  const m = g.scene; if (q.get('ry')) m.rotation.y = +q.get('ry') * Math.PI / 180; S.add(m); m.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const parts = []; let tris = 0; m.traverse((o) => { if (o.isMesh) { const n = (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; tris += n; const bb = new THREE.Box3().setFromObject(o); parts.push({ name: o.name, parent: o.parent && o.parent.name, mat: (Array.isArray(o.material) ? o.material.map((x) => x.name).join('+') : o.material.name), tris: n, min: bb.min.toArray().map((v) => +v.toFixed(2)), max: bb.max.toArray().map((v) => +v.toFixed(2)) }); } });
  window.info = { size: sz.toArray().map((v) => +v.toFixed(3)), center: c.toArray().map((v) => +v.toFixed(3)), min: box.min.toArray().map((v) => +v.toFixed(3)), tris, n: parts.length, parts };
  const d = Math.max(sz.x, sz.y, sz.z) * 1.25, cam = new THREE.PerspectiveCamera(35, 640 / 400, 0.01, 1000);
  [[1, 0.35, 1], [-1, 0.35, 1], [1, 0.1, 0], [0, 0.1, 1], [0, 1.4, 0.01], [-1, 0.35, -1]].forEach(([x, y, z]) => {
    cam.position.set(c.x + x * d, c.y + y * d, c.z + z * d); cam.lookAt(c); R.render(S, cam);
    const im = document.createElement('img'); im.src = R.domElement.toDataURL(); im.style.width = '100%'; document.getElementById('c').appendChild(im);
  });
  document.getElementById('o').textContent = JSON.stringify({ size: info.size, center: info.center, min: info.min, tris, n: parts.length });
  // hl((mesh) => bool[, views]): paint the matching meshes red and re-render (dev inspection)
  const red = new THREE.MeshBasicMaterial({ color: 0xff2020 }), orig = new Map(); m.traverse((o) => { if (o.isMesh) orig.set(o, o.material); });
  window.M = m;
  // hideOthers: true = show only the matches; 'hide' = hide the matches (and show everything else in its own colours)
  window.hl = (fn, views = [[1, 0.35, 1], [-1, 0.35, 1], [1, 0.1, 0], [0, 0.1, 1], [0, -1.4, 0.01], [-1, 0.35, -1]], zoom = 1, hideOthers = false) => {
    m.traverse((o) => { if (!o.isMesh) return; const on = fn(o); if (hideOthers === 'hide') { o.material = orig.get(o); o.visible = !on; return; } o.material = on ? red : orig.get(o); o.visible = on || !hideOthers; });
    const box2 = new THREE.Box3(); m.traverse((o) => { if (o.isMesh && o.visible) box2.expandByObject(o); }); const c2 = hideOthers === true ? box2.getCenter(new THREE.Vector3()) : c, d2 = d / zoom;
    const el = document.getElementById('c'); el.innerHTML = '';
    views.forEach(([x, y, z]) => { cam.position.set(c2.x + x * d2, c2.y + y * d2, c2.z + z * d2); cam.lookAt(c2); R.render(S, cam); const im = document.createElement('img'); im.src = R.domElement.toDataURL(); im.style.width = '100%'; el.appendChild(im); });
  };
  // post the current views as one contact sheet to the local snapshot receiver (tools/snap-server.ps1)
  window.post = async (name) => { const imgs = [...document.querySelectorAll('#c img')], cv = document.createElement('canvas'); cv.width = 1280; cv.height = 400 * Math.ceil(imgs.length / 2); const x = cv.getContext('2d');
    await Promise.all(imgs.map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = r; }))));
    imgs.forEach((im, i) => x.drawImage(im, (i % 2) * 640, Math.floor(i / 2) * 400, 640, 400));
    await fetch('http://localhost:8766/snap?name=' + name, { method: 'POST', body: cv.toDataURL('image/jpeg', 0.85) }); };
  window.done = true;
}, undefined, (e) => { document.getElementById('o').textContent = 'ERR ' + e; window.done = true; });
</script></body></html>
